<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iivari Kortesoja</title>

    <!-- MICROSOFT CLARITY -->

        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Arial',sans-serif;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
        .container{max-width:600px;width:100%;padding:20px;text-align:center}
        h1{font-size:clamp(2.5rem,8vw,4rem);margin-bottom:40px;text-shadow:0 0 30px rgba(0,0,0,.8);opacity:0;animation:fadeInDown .8s ease forwards}
        .links{list-style:none;display:flex;flex-direction:column;gap:20px;width:100%}
        .links a{display:flex;align-items:center;justify-content:center;padding:20px;border-radius:20px;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.7);text-decoration:none;color:#fff;font-size:1.4rem;transition:.3s;position:relative;overflow:hidden;gap:15px;opacity:0;transform:translateY(30px);animation:slideUp .8s ease forwards}
        /* YKSI ELEMENTTI KERRALLAAN – PIDEMMÄT DELAYT */
        .links a:nth-child(1){animation-delay:0.3s}
        .links a:nth-child(2){animation-delay:0.5s}
        .links a:nth-child(3){animation-delay:0.7s}
        .links a:nth-child(4){animation-delay:0.9s}
        .links a:nth-child(5){animation-delay:1.1s}
        .links a:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,.8);background:#333}
        .links a::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:4px;background:#4ade80;transition:width .3s}
        .links a:hover::after{width:80%}
        .icon{width:2.5rem;height:2.5rem;object-fit:contain;flex-shrink:0}
        .emoji-icon{font-size:2.5rem;flex-shrink:0}
        /* INSTAGRAM ISOMPI */
        .instagram-icon{width:3.2rem;height:3.2rem}
        /* LINKEDIN PIENEMPI KUIN INSTAGRAM */
        .linkedin-icon{width:2.2rem;height:2.2rem}
        footer{margin-top:80px;font-size:1rem;color:#aaa;opacity:0;animation:fadeIn .8s ease forwards;animation-delay:1.3s}

        @keyframes fadeInDown{
            from{opacity:0;transform:translateY(-30px)}
            to{opacity:1;transform:translateY(0)}
        }
        @keyframes slideUp{
            from{opacity:0;transform:translateY(30px)}
            to{opacity:1;transform:translateY(0)}
        }
        @keyframes fadeIn{
            from{opacity:0}
            to{opacity:1}
        }

        @media(max-width:480px){
            .links a{font-size:1.2rem;padding:16px;gap:12px}
            .icon,.emoji-icon{width:2rem;height:2rem;font-size:2rem}
            .instagram-icon{width:2.5rem;height:2.5rem}
            .linkedin-icon{width:1.8rem;height:1.8rem}
            .links{gap:15px}
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Iivari Kortesoja</h1>
        <ul class="links">
            <!-- 1. NETTISIVUT -->
            <li><a href="https://iivarikortesoja.media" target="_blank">
                <span class="emoji-icon">🌐</span>
                Nettisivut (iivarikortesoja.media)
            </a></li>
            <!-- 2. VALOKUVAUS -->
            <li><a href="valokuvaus.html">
                <span class="emoji-icon">📸</span>
                Yksityisten ihmisten valokuvaus
            </a></li>
            <!-- 3. LINKEDIN – PIENEMPI -->
            <li><a href="https://www.linkedin.com/in/iivarikortesoja/" target="_blank">
                <img src="linkedin.webp" alt="LinkedIn" class="icon linkedin-icon">
                LinkedIn
            </a></li>
            <!-- 4. INSTAGRAM – ISOMPI -->
            <li><a href="https://www.instagram.com/iivarikortesoja/" target="_blank">
                <img src="instagram.png" alt="Instagram" class="icon instagram-icon">
                Instagram
            </a></li>
            <!-- 5. YOUTUBE -->
            <li><a href="https://studio.youtube.com/channel/UCnyz7Jyse_kNI745fRcTNDQ" target="_blank">
                <img src="youtube.webp" alt="YouTube" class="icon">
                YouTube
            </a></li>
        </ul>
        <footer>© Iivari Kortesoja 2026</footer>
    </div>

</body>
</html>
