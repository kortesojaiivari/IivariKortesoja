    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
     
        body { font-family: 'Inter', system_ui, sans-serif; }
        h1, h2 { font-family: 'Playfair Display', sans-serif; }
     
        .project-section { transition: all 0.3s ease; }
        .project-section:hover { transform: translateY(-4px); }
     
        /* AUTOMAATTINEN GALLERIA */
        .dynamic-grid { transition: opacity 0.7s ease-in-out; }
     
        .gallery-pagination {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .dot-container {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background-color: #27272a;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            background-color: #4ade80;
            transform: scale(1.8);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
        }

        /* Combat Camera */
        .combat-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .combat-item {
            position: relative;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.7);
            cursor: pointer;
            opacity: 0;
            transform: translateX(-80px);
            transition: all .5s ease;
        }
        .combat-item.visible { opacity: 1; transform: translateX(0); }
        .combat-item img { width: 100%; height: 100%; object-fit: cover; transition: opacity .4s; }
        .combat-item::after {
            content: '▶';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            color: #fff;
            opacity: 0;
            transition: all .4s ease;
            pointer-events: none;
        }
        .combat-item:hover::after { opacity: 0.9; transform: translate(-50%, -50%) scale(1.2); }
        .combat-item:hover img { opacity: 0.75; }

        .extra-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 80px auto 100px;
            padding: 0 20px;
        }
        .extra-item {
            position: relative;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,.8);
        }
        .extra-item img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.4s ease;
        }
        .extra-item img.active { opacity: 1; }

        /* Coming Soon */
        .coming-soon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .plank-box {
            position: relative;
            height: 340px;
            border-radius: 20px;
            background: #27272a;
            border: 2px dashed #3f3f46;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* MOBIILI SKAALAUKSET & INDIKAATTORIT */
        @media (max-width: 768px) {
            /* Palleroiden koko pyynnöstäsi: puolitettu 0.1px -> 0.05px */
            .dot { 
                width: 0.05px; 
                height: 0.05px; 
            }
            .dot.active { 
                width: 0.25px;
                height: 0.25px;
                transform: none; 
                box-shadow: none; 
            }
            .dot-container { gap: 2px; }

            /* Gridit mobiilissa */
            .combat-gallery, .extra-gallery, .coming-soon-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .combat-item { height: 180px; }
            .extra-item { height: 300px; }
            .plank-box { height: 200px; }

            /* Evästebanneri mobiilissa */
            #cookie-banner { 
                flex-direction: column; 
                text-align: center; 
                gap: 15px; 
                padding: 20px 15px; 
            }
            #cookie-banner .buttons { width: 100%; justify-content: center; }
        }

        footer {
            background: #000;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #333;
            font-size: 1rem;
            color: #71717a;
        }

        #cookie-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1f1f1f; color: #ddd;
            padding: 18px 20px; display: none;
            align-items: center; justify-content: center; gap: 40px;
            z-index: 9999; border-top: 1px solid #333;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.8);
            transform: translateY(100%);
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #cookie-banner.show { transform: translateY(0); display: flex; }
        #cookie-banner button {
            padding: 11px 26px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-reject { background: transparent; color: #bbb; border: 2px solid #555; }
        .btn-accept { background: #4ade80; color: #000; border: none; }
    </style>

    <script>
        // --- GALLERIA 1 (TuplaKupla) ---
        const allMediaItems1 = [
            { src: "MEDIA/VALOKUVAUS/Valokuvaus40.webp", alt: "TK1" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus41.webp", alt: "TK2" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus42.webp", alt: "TK3" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus43.webp", alt: "TK4" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus44.webp", alt: "TK5" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus45.webp", alt: "TK6" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus46.webp", alt: "TK7" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus47.webp", alt: "TK8" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus48.webp", alt: "TK9" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus49.webp", alt: "TK10" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus50.webp", alt: "TK11" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus51.webp", alt: "TK12" }
        ];
        let currentPage1 = 1; 
        const itemsPerPage = 3;
        const totalPages1 = Math.ceil(allMediaItems1.length / itemsPerPage);

        function renderGallery1(){
            const grid = document.getElementById("gallery-grid-1");
            grid.style.opacity = '0';
            setTimeout(() => {
                grid.innerHTML = '';
                const start = (currentPage1 - 1) * itemsPerPage;
                allMediaItems1.slice(start, start + itemsPerPage).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'group relative overflow-hidden rounded-2xl aspect-[4/3] bg-zinc-900';
                    div.innerHTML = `<img src="${item.src}" alt="${item.alt}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">`;
                    grid.appendChild(div);
                });
                grid.style.opacity = '1';
                updateDots(1, currentPage1);
            }, 350);
        }

        // --- GALLERIA 2 (Laura) ---
        const allMediaItems2 = [
            { src: "MEDIA/VALOKUVAUS/Valokuvaus62.webp", alt: "L1" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus68.webp", alt: "L2" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus73.webp", alt: "L3" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus54.webp", alt: "L4" },
            { src: "MEDIA/VALOKUVAUS/Valokuvaus76.webp", alt: "L5" }, { src: "MEDIA/VALOKUVAUS/Valokuvaus65.webp", alt: "L6" }
        ];
        let currentPage2 = 1;
        const totalPages2 = Math.ceil(allMediaItems2.length / itemsPerPage);

        function renderGallery2(){
            const grid = document.getElementById("gallery-grid-2");
            grid.style.opacity = '0';
            setTimeout(() => {
                grid.innerHTML = '';
                const start = (currentPage2 - 1) * itemsPerPage;
                allMediaItems2.slice(start, start + itemsPerPage).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'group relative overflow-hidden rounded-2xl aspect-[4/3] bg-zinc-900';
                    div.innerHTML = `<img src="${item.src}" alt="${item.alt}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">`;
                    grid.appendChild(div);
                });
                grid.style.opacity = '1';
                updateDots(2, currentPage2);
            }, 350);
        }

        // --- YHTEISET DOTS ---
        function createDots(id, total, current, targetId){
            const container = document.getElementById(targetId);
            container.innerHTML = '';
            for(let i=1; i<=total; i++){
                const dot = document.createElement('button');
                dot.className = `dot ${i === current ? 'active' : ''}`;
                dot.onclick = () => {
                    if(id === 1) { currentPage1 = i; renderGallery1(); }
                    else { currentPage2 = i; renderGallery2(); }
                };
                container.appendChild(dot);
            }
        }

        function updateDots(id, current){
            const dots = document.querySelectorAll(`#gallery-dots-${id} .dot`);
            dots.forEach((dot, i) => dot.classList.toggle('active', i + 1 === current));
        }

        // --- COMBAT CAMERA LOGIIKKA ---
        const combatObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => entry.target.classList.add('visible'), i * 120);
                }
            });
        }, {threshold: 0.1});
        document.querySelectorAll('.combat-item').forEach(t => combatObserver.observe(t));

        // Extra-gallery vaihto
        document.querySelectorAll('.extra-item').forEach(box => {
            const imgs = box.querySelectorAll('img');
            let idx = 0;
            setInterval(() => {
                imgs[idx].classList.remove('active');
                idx = (idx + 1) % imgs.length;
                imgs[idx].classList.add('active');
            }, 4000);
        });

        // INIT
        window.addEventListener('load', () => {
            renderGallery1(); createDots(1, totalPages1, 1, "gallery-dots-1");
            renderGallery2(); createDots(2, totalPages2, 1, "gallery-dots-2");
            
            // Auto-cycle gallerioille
            setInterval(() => { currentPage1 = (currentPage1 % totalPages1) + 1; renderGallery1(); }, 5000);
            setInterval(() => { currentPage2 = (currentPage2 % totalPages2) + 1; renderGallery2(); }, 5500);
        });
    </script>
