    <style>
        .hero-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            z-index: 10;
        }

        .service-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            margin-top: 40px;
            padding: 0 20px;
        }

        .service-btn {
            background: linear-gradient(135deg, #2c3e50, #1f2a3c);
            color: white;
            border: none;
            padding: 32px 24px;
            font-size: 1.45rem;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .service-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-btn:hover::before {
            opacity: 1;
        }

        .service-btn:hover {
            transform: translateY(-12px) scale(1.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .service-btn.active {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            transform: scale(1.08);
            box-shadow: 0 15px 35px rgba(230, 126, 34, 0.5);
        }

        .service-btn span {
            font-size: 2.8rem;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .service-buttons-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
            }
            .service-btn {
                font-size: 1.25rem;
                padding: 26px 18px;
                min-height: 130px;
            }
            .service-btn span {
                font-size: 2.4rem;
            }
        }
    </style>
