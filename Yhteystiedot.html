<html lang="fi">
<head>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif}
        body{background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}

        section{padding:100px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #contact{max-width:1200px;margin:0 auto}

        /* Dynamic title container – tyhjäksi jätettävä paikka, korkeus hoidetaan JS:llä */
        #dynamic-title{
            position: relative;
            width: 100%;
            min-height: 120px; /* fallback, JS ylikirjoittaa */
            margin-bottom: 35px;
            overflow: hidden;
        }

        #dynamic-title span{
            font-size: 3.8em;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0,0,0,.8);
            white-space: nowrap;
        }

        #contact .intro-text{
            font-size: 1.4em;
            margin: 0 0 35px;
            color: #d1d5db;
            max-width: 720px;
        }

        #contact .contact-info{
            font-size: 1.3em;
            margin: 20px 0;
        }

        #contact a{
            color: #4ade80;
            text-decoration: none;
            transition: .3s;
        }

        #contact a:hover{
            opacity: 0.8;
            text-decoration: underline;
        }

        .social-links{
            margin-top: 45px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .social-icon{
            width: 64px;
            height: 64px;
            transition: transform .3s ease, filter .3s ease;
            filter: brightness(0.9) contrast(1.1);
        }

        .social-icon:hover{
            transform: scale(1.15);
            filter: brightness(1.2) drop-shadow(0 0 12px rgba(74,222,128,0.5));
        }

        footer{
            background: #000;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.95em;
            color: #888;
        }

        footer a{
            color: #4ade80;
            text-decoration: none;
        }

        footer a:hover{
            text-decoration: underline;
        }

        @media(max-width: 768px){
            #dynamic-title{
                min-height: 90px;
            }
            #dynamic-title span{
                font-size: 2.8em;
            }
            .social-icon{
                width: 56px;
                height: 56px;
            }
            #contact .intro-text{
                font-size: 1.25em;
            }
            #contact .contact-info{
                font-size: 1.15em;
            }
        }
    </style>

    <!-- Shared header script -->
    <script src="SKRIPTIT/header.js" defer></script>
    <script src="SKRIPTIT/mobile-scaling.js" defer></script>
    <!-- Uusi dynaaminen otsikko-skripti -->
    <script src="SKRIPTIT/dynamic-title.js" defer></script>
</head>
<body>

    <section id="contact">
        <div id="dynamic-title">
            <span>Ota yhteyttä</span>
            <span>Työskennellään yhdessä</span>
            <span>Keskustellaan projekteista</span>
            <span>Löydetään ratkaisu</span>
        </div>

        <p class="intro-text">Ota rohkeasti yhteyttä – katsotaan, miten voin auttaa sinun projektissasi tai ideassasi!</p>

        <div class="contact-info">
            <p>Sähköposti: <a href="mailto:kortesoja.iivari@gmail.com">kortesoja.iivari@gmail.com</a></p>
            <p>Puhelin: <a href="tel:+358405247918">040 524 7918</a></p>
        </div>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/iivarikortesoja" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/linkedin.webp" alt="LinkedIn" class="social-icon">
            </a>
            <a href="https://api.whatsapp.com/message/2JQ4G2D3EXLID1?autoload=1&app_absent=0" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/whatsapp.webp" alt="WhatsApp" class="social-icon">
            </a>
        </div>
    </section>

    <footer>
        <p>© Iivari Kortesoja 2025 | Y-tunnus 3591660-9</p>
    </footer>

</body>
</html>
