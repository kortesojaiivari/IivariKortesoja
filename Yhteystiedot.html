    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif}
        body{background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}

        section{padding:80px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #contact{max-width:1000px;margin:0 auto}

        /* Dynamic title – pienempi koko */
        #dynamic-title{
            position: relative;
            width: 100%;
            min-height: 80px;          /* pienempi korkeus */
            margin-bottom: 25px;
            overflow: hidden;
        }

        #dynamic-title span{
            font-size: 2.6rem;         /* selvästi pienempi kuin aiempi 3.8em */
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0,0,0,.7);
            white-space: nowrap;
        }

        #contact .intro-text{
            font-size: 1.25rem;        /* pienempi */
            margin: 0 0 30px;
            color: #d1d5db;
            max-width: 680px;
        }

        #contact .contact-info{
            font-size: 1.2rem;         /* hieman pienempi */
            margin: 18px 0;
        }

        #contact a{
            color: #4ade80;
            text-decoration: none;
            transition: .3s;
        }

        #contact a:hover{
            opacity: 0.85;
            text-decoration: underline;
        }

        .social-links{
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .social-icon{
            width: 52px;               /* hieman pienemmät ikonit */
            height: 52px;
            transition: transform .3s ease, filter .3s ease;
            filter: brightness(0.92) contrast(1.08);
        }

        .social-icon:hover{
            transform: scale(1.12);
            filter: brightness(1.15) drop-shadow(0 0 10px rgba(74,222,128,0.45));
        }

        footer{
            background: #000;
            text-align: center;
            padding: 25px 20px;
            font-size: 0.9rem;
            color: #888;
        }

        footer a{
            color: #4ade80;
            text-decoration: none;
        }

        footer a:hover{
            text-decoration: underline;
        }

        @media(max-width: 768px){
            section{padding:60px 16px;}
            #dynamic-title{
                min-height: 70px;
            }
            #dynamic-title span{
                font-size: 2.1rem;     /* mobiilissa vielä pienempi */
            }
            .intro-text{
                font-size: 1.1rem;
            }
            .contact-info{
                font-size: 1.05rem;
            }
            .social-icon{
                width: 48px;
                height: 48px;
            }
        }

        @media(max-width: 480px){
            #dynamic-title span{
                font-size: 1.9rem;
            }
        }
    </style>

    <!-- Shared header script -->
    <script src="SKRIPTIT/header.js" defer></script>
    <script src="SKRIPTIT/mobile-scaling.js" defer></script>
    <!-- Dynaaminen otsikko -->
    <script src="SKRIPTIT/dynamic-title.js" defer></script>
</head>
<body>

    <section id="contact">
        <div id="dynamic-title">
            <span>Ota yhteyttä</span>
            <span>Työskennellään yhdessä</span>
            <span>Keskustellaan projekteista</span>
            <span>Löydetään ratkaisu</span>
        </div>

        <p class="intro-text">Ota rohkeasti yhteyttä – katsotaan, miten voin auttaa sinun projektissasi tai ideassasi!</p>

        <div class="contact-info">
            <p>Sähköposti: <a href="mailto:kortesoja.iivari@gmail.com">kortesoja.iivari@gmail.com</a></p>
            <p>Puhelin: <a href="tel:+358405247918">040 524 7918</a></p>
        </div>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/iivarikortesoja" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/linkedin.webp" alt="LinkedIn" class="social-icon">
            </a>
            <a href="https://api.whatsapp.com/message/2JQ4G2D3EXLID1?autoload=1&app_absent=0" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/whatsapp.webp" alt="WhatsApp" class="social-icon">
            </a>
        </div>
    </section>

    <footer>
        <p>© Iivari Kortesoja 2025–2026 | Y-tunnus 3591660-9</p>
    </footer>

</body>
</html>
