    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Arial',sans-serif;background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}

        section{padding:80px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

        #contact{max-width:800px;margin:0 auto}

        #dynamic-title{
            position:relative;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:80px;
            margin-bottom:30px;
            padding:4px 0 8px;
        }

        #dynamic-title span{
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            font-size:clamp(1.8rem, 6vw, 2.8rem);
            font-weight:600;
            text-shadow:0 0 20px rgba(0,0,0,.7);
            white-space:nowrap;
            pointer-events:none;
        }

        #contact h2{
            font-size:clamp(2rem, 6vw, 2.8rem);
            margin-bottom:25px;
        }

        #contact p{
            font-size:1.25rem;
            margin:18px 0;
            color:#e0e0e0;
        }

        #contact a{
            color:#4ade80;
            text-decoration:none;
            transition:.25s;
        }

        #contact a:hover{
            text-decoration:underline;
            opacity:0.9;
        }

        .social-links{
            display:flex;
            gap:28px;
            justify-content:center;
            margin-top:35px;
        }

        .social-icon{
            width:40px;
            height:40px;
            object-fit:contain;
            transition:transform .3s ease;
        }

        .social-icon:hover{
            transform:scale(1.18);
        }

        footer{
            background:#000;
            padding:35px 20px;
            text-align:center;
            font-size:0.95rem;
            color:#888;
            border-top:1px solid #222;
        }

        @media(max-width:768px){
            section{padding:60px 16px;}
            #dynamic-title{
                min-height:70px;
            }
            #dynamic-title span{
                font-size:clamp(1.6rem, 7vw, 2.3rem);
            }
            #contact h2{
                font-size:clamp(1.9rem, 7vw, 2.4rem);
            }
            #contact p{
                font-size:1.1rem;
            }
            .social-icon{
                width:36px;
                height:36px;
            }
        }

        @media(max-width:480px){
            #dynamic-title{
                min-height:60px;
            }
            #dynamic-title span{
                font-size:clamp(1.5rem, 8vw, 2.1rem);
            }
        }
    </style>

    <!-- Skriptit -->
    <script src="SKRIPTIT/dynamic-title.js" defer></script>
    <script src="SKRIPTIT/header.js" defer></script>
    <script src="SKRIPTIT/mobile-scaling.js" defer></script>
</head>
<body>

    <section id="contact">
        <div id="dynamic-title">
            <span>Ota yhteyttä</span>
            <span>Työskennellään yhdessä</span>
            <span>Katsotaan projektisi</span>
            <span>Laitetaan hommiin</span>
        </div>

        <h2>Yhteystiedot</h2>
        
        <p>Ota yhteyttä ja keskustellaan tulevista projekteista!</p>
        <p>Sähköposti: <a href="mailto:kortesoja.iivari@gmail.com">kortesoja.iivari@gmail.com</a></p>
        <p>Puhelin: <a href="tel:+358405247918">040 524 7918</a></p>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/iivarikortesoja" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/linkedin.webp" alt="LinkedIn" class="social-icon">
            </a>
            <a href="https://api.whatsapp.com/message/2JQ4G2D3EXLID1?autoload=1&app_absent=0" target="_blank" rel="noopener noreferrer">
                <img src="MEDIA/Ikonit/whatsapp.webp" alt="WhatsApp" class="social-icon">
            </a>
        </div>
    </section>

    <footer>
        <p>© Iivari Kortesoja 2026 | Y-tunnus 3591660-9</p>
    </footer>

</body>
