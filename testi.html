<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-generoitu hinnoittelu - esimerkki</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #1a1a1a; 
      color: #fff; 
      margin: 0; 
      padding: 40px; 
      line-height: 1.6; 
    }
    #pricing { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 0 20px; 
    }
    h2 { 
      text-align: center; 
      font-size: 3rem; 
      margin-bottom: 1.5rem; 
      color: #4ade80; 
    }
    .disclaimer { 
      text-align: center; 
      color: #bbb; 
      margin-bottom: 2.5rem; 
      font-size: 0.95rem; 
    }
    .upper-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }
    .lower-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    .pricing-box {
      background: #222;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.6);
      text-align: center;
      transition: transform 0.3s ease;
    }
    .pricing-box:hover {
      transform: translateY(-10px);
    }
    .pricing-box h3 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .pricing-box .price {
      font-size: 2.8rem;
      font-weight: bold;
      color: #4ade80;
      margin: 0.5rem 0 1rem;
    }
    .pricing-box p {
      color: #ccc;
      margin: 0.8rem 0;
    }
    .pricing-box ul {
      list-style: none;
      text-align: left;
      margin: 1.5rem 0;
      padding: 0;
      font-size: 1.15rem;
    }
    .pricing-box ul li {
      padding-left: 1.5rem;
      position: relative;
      margin: 0.6rem 0;
    }
    .pricing-box ul li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: #4ade80;
    }
    .pricing-box ul li strong {
      color: #fff;
    }
    .quote {
      font-style: italic;
      color: #aaa;
      margin-top: 1.5rem;
      font-size: 1.1rem;
    }
    .contact-box {
      background: #333;
      padding: 30px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .contact-btn {
      background: #4ade80;
      color: #000;
      padding: 15px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.3rem;
      transition: all 0.3s;
    }
    .contact-btn:hover {
      background: #5aff90;
      transform: scale(1.05);
    }

    @media (max-width: 900px) {
      .lower-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <section id="pricing">
    <h2>Hinnoittelu</h2>
    <p class="disclaimer">*Nämä ovat suuntaa-antavia hintoja. Hinnat sisältävät ALV 25,5 %. Matkakustannukset lisätään erikseen tarpeen mukaan.</p>

    <!-- Tähän generoidaan upper-paketit -->
    <div class="upper-row"></div>

    <!-- Lower row: hääpaketti + yhteydenotto -->
    <div class="lower-row">
      <!-- Hääpaketti generoidaan tänne -->
      <!-- yhteydenottolaatikko on staattinen -->
      <div class="contact-box">
        <p>Eikö mieleistä pakettia löytynyt?<br>Ota yhteyttä, niin räätälöidään juuri sinulle sopiva ratkaisu!</p>
        <a href="#yhteys" class="contact-btn">Ota yhteyttä</a>
      </div>
    </div>
  </section>

  <script>
    // ────────────────────────────────────────────────
    // Hinnoitteludata – tätä muokkaat jatkossa
    // ────────────────────────────────────────────────
    const upperPackages = [
      {
        title: '3 tuntia',
        price: '400 €',
        desc: 'Esimerkiksi hautajaiset tai valmistujaisjuhlat'
      },
      {
        title: '6 tuntia',
        price: '700 €',
        desc: 'Pidempään kestävät tilaisuudet tai kevyempi hääkuvaus'
      }
    ];

    const lowerPackages = [
      {
        title: 'Hääpaketti',
        price: '1000 €',
        features: [
          'Dokumentaarinen hääkuvaus <strong>koko hääpäivän ajan</strong>',
          'Elokuvallinen häävideo tärkeimmästä päivästä',
          'Ei stressiä kuvausajasta',
          'Eniten valokuvia'
        ],
        quote: 'Monet sanovat, että kuva kertoo enemmän kuin tuhat sanaa. Minä sanon, että liikkuva kuva kertoo vieläkin enemmän.'
      }
    ];

    // ────────────────────────────────────────────────
    // Renderöintifunktio
    // ────────────────────────────────────────────────
    function createPricingBox(pkg, isLarge = false) {
      const box = document.createElement('div');
      box.className = 'pricing-box';
      
      let html = `<h3>${pkg.title}</h3>`;
      html += `<p class="price">${pkg.price}</p>`;
      
      if (pkg.desc) {
        html += `<p>${pkg.desc}</p>`;
      }
      
      if (pkg.features) {
        html += '<ul>';
        pkg.features.forEach(item => {
          html += `<li>${item}</li>`;
        });
        html += '</ul>';
      }
      
      if (pkg.quote) {
        html += `<p class="quote">${pkg.quote}</p>`;
      }
      
      box.innerHTML = html;
      
      // Jos iso paketti (yleensä lower), voi lisätä tyyliä
      if (isLarge) {
        box.style.fontSize = '1.1rem';
      }
      
      return box;
    }

    // ────────────────────────────────────────────────
    // Suorita renderöinti
    // ────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      const upperRow = document.querySelector('.upper-row');
      upperPackages.forEach(pkg => {
        upperRow.appendChild(createPricingBox(pkg));
      });

      const lowerRow = document.querySelector('.lower-row');
      const contactBox = lowerRow.querySelector('.contact-box');

      lowerPackages.forEach(pkg => {
        lowerRow.insertBefore(createPricingBox(pkg, true), contactBox);
      });

      // Jos lower-paketteja useampi → mukauta grid
      if (lowerPackages.length > 1) {
        lowerRow.style.gridTemplateColumns = `repeat(${lowerPackages.length + 1}, 1fr)`;
      }
    });
  </script>

</body>
</html>v
