<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valokuvaus | Iivari Kortesoja</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Arial',sans-serif;background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}
        
        #home{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
        #home video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1}
        #home h2{font-size:clamp(2.5rem,8vw,4rem);text-shadow:0 0 40px rgba(0,0,0,.9)}

        /* PORTFOLIO-OSIO – H3 ASETETTU 3REM */
        .project-section {
            padding: 100px 0;
            background: #1a1a1a;
        }

        .project-header {
            max-width: 1400px;
            margin: 0 auto 2.5rem;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .project-header .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            font-weight: 400;
            color: #4ade80;
            margin-bottom: 0.75rem;
            display: block;
        }

        .project-header .changing-title {
            font-size: 3rem !important; /* Tyylikäs ja hillitty 3rem */
            font-weight: 700 !important;
            letter-spacing: -0.01em !important;
            line-height: 1.2 !important;
            margin: 0 !important;
            color: #ffffff;
        }

        #changing-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 0 20px;
        }

        #changing-grid .group {
            aspect-ratio: 1/1; /* Neliömuoto toimii hienosti 3rem otsikon kanssa */
            overflow: hidden;
            border-radius: 8px;
            background: #111;
        }

        #changing-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
        }

        #changing-grid .group:hover img { transform: scale(1.08); }

        /* Mobiilivasteet */
        @media (max-width: 1024px) {
            #changing-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .project-header .changing-title { font-size: 2.2rem !important; }
            #changing-grid { grid-template-columns: 1fr; }
        }

        footer{background:#000;padding:60px 20px;text-align:center;font-size: 0.9rem;color: #666;}
    </style>
</head>
<body>

    <section id="home">
        <video autoplay muted loop playsinline>
            <source src="MEDIA/Pääsivu_Videotuotannot ja Valokuvaus/2000luvunkamera.webm" type="video/webm">
        </video>
        <h2>Valokuvaus</h2>
    </section>

    <section class="project-section">
        <div class="project-header">
            <span class="subtitle">VALIKOIDUT TYÖT</span>
            <h3 id="changing-title" class="changing-title">Ladataan...</h3>
        </div>
        <div id="changing-grid"></div>
    </section>

    <footer>
        <p>© Iivari Kortesoja 2026 | Portfolio</p>
    </footer>

    <script>
        const projects = [
            {
                title: "TuplaKupla - Teatteri",
                media: [
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus40.webp", alt: "1" },
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus41.webp", alt: "2" },
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus42.webp", alt: "3" }
                ]
            },
            {
                title: "Hääkuvaus",
                media: [
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus43.webp", alt: "4" },
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus44.webp", alt: "5" },
                    { src: "MEDIA/VALOKUVAUS/Valokuvaus45.webp", alt: "6" }
                ]
            }
        ];

        let currentIndex = 0;
        function renderProject() {
            const titleEl = document.getElementById('changing-title');
            const grid = document.getElementById('changing-grid');
            if(!titleEl || !grid) return;

            grid.style.opacity = '0';
            setTimeout(() => {
                titleEl.textContent = projects[currentIndex].title;
                grid.innerHTML = projects[currentIndex].media.map(item => `
                    <div class="group"><img src="${item.src}" alt="${item.alt}"></div>
                `).join('');
                grid.style.opacity = '1';
            }, 300);
        }

        setInterval(() => {
            currentIndex = (currentIndex + 1) % projects.length;
            renderProject();
        }, 5000);

        window.onload = renderProject;
    </script>
</body>
</html>
