    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Arial',sans-serif;background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}
        header{background:#000;padding:15px 20px;text-align:center;position:fixed;width:100%;top:0;z-index:1000;backdrop-filter:blur(10px)}
        nav a{color:#fff;text-decoration:none;margin:0 15px;font-size:1.2em;position:relative;transition:.3s}
        nav a:hover{color:#4ade80}
        nav a::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:2px;background:#4ade80;transition:width .3s}
        nav a:hover::after{width:100%}

        section{padding:100px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #contact{max-width:800px;margin:0 auto}

        /* VAIHTUVA OTSIKKO – SAMANLAINEN SLIDE UP + FADE KUIN ETUSIVULLA */
        #dynamic-title{
            position:relative;
            height:80px;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:40px;
        }
        #dynamic-title span{
            position:absolute;
            width:100%;
            text-align:center;
            font-size:clamp(2.5rem,8vw,3.5rem);
            opacity:0;
            transform:translateY(50px);
            animation:slideUpFade 18s infinite;
        }
        #dynamic-title span:nth-child(1){animation-delay:0s}
        #dynamic-title span:nth-child(2){animation-delay:6s}
        #dynamic-title span:nth-child(3){animation-delay:12s}

        @keyframes slideUpFade{
            0%{opacity:0;transform:translateY(50px)}
            10%{opacity:1;transform:translateY(0)}
            25%{opacity:1;transform:translateY(0)}
            33%{opacity:0;transform:translateY(-50px)}
            100%{opacity:0;transform:translateY(-50px)}
        }

        #contact p{font-size:1.4rem;margin:20px 0}
        #contact a{color:#4ade80;text-decoration:none;transition:.3s}
        #contact a:hover{opacity:0.8}

        footer{background:#000;padding:40px 20px;text-align:center;font-size:1rem;border-top:1px solid #333}

        @media(max-width:768px){
            nav a{margin:0 10px;font-size:1em}
            #dynamic-title{height:60px}
            #contact p{font-size:1.2rem}
        }
    </style>
