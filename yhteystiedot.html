    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif}
        body{background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}
        /* header/nav styles moved to SKRIPTIT/header.js to keep header yhtenäisenä */

        section{padding:100px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #contact{max-width:1200px;margin:0 auto}

        /* TÄYSIN SAMA SLIDE UP + FADE ANIMAATIO KUIN ETUSIVULLA – TOIMII NYT */
        #dynamic-title{
            position:relative;
            height:100px;
            overflow:hidden;
            margin-bottom:20px;
        }
        #dynamic-title span{
            position:absolute;
            width:100%;
            text-align:center;
            font-size:3.5em;
            text-shadow:0 0 30px rgba(0,0,0,.8);
            opacity:0;
            transform:translateY(100%);
            animation:slideUpFade 18s infinite linear;
        }
        #dynamic-title span:nth-child(1){animation-delay:0s}
        #dynamic-title span:nth-child(2){animation-delay:6s}
        #dynamic-title span:nth-child(3){animation-delay:12s}

        @keyframes slideUpFade{
            0% {opacity:0; transform:translateY(100%)}
            8% {opacity:1; transform:translateY(0)}
            25% {opacity:1; transform:translateY(0)}
            33% {opacity:0; transform:translateY(-100%)}
            100% {opacity:0; transform:translateY(-100%)}
        }

        #contact p{font-size:1.3em;margin:15px 0}
        #contact a{color:#4ade80;transition:.3s}
        #contact a:hover{opacity:0.8}

        footer{background:#000;text-align:center;padding:25px}

        @media(max-width:768px){
            /* nav a styles removed here — now in shared header */
            #dynamic-title{height:80px}
            #dynamic-title span{font-size:2.5em}
            #contact p{font-size:1.1em}
        }
    </style>

    <!-- Shared header script (in SKRIPTIT/header.js) -->
    <script src="SKRIPTIT/header.js" defer></script>
    <!-- Mobile scaling script for better mobile experience -->
    <script src="SKRIPTIT/mobile-scaling.js" defer></script>

    <section id="contact">
        <div id="dynamic-title">
            <span>Ota yhteyttä</span>
            <span>Työskennellään yhdessä</span>
            <span>Keskustellaan projekteista</span>
        </div>
        <p>Sähköposti: <a href="mailto:example@email.com">example@email.com</a></p>
        <p>Puhelin: <a href="tel:+358405247918">040 5247918</a></p>
    </section>
