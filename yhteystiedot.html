    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif}
        body{background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}
        header{background:#000;padding:20px;text-align:center;position:fixed;width:100%;top:0;z-index:1000}
        nav a{color:#fff;text-decoration:none;margin:0 20px;font-size:1.2em;transition:.3s;position:relative}
        nav a:hover{color:#4ade80}
        nav a::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:0;height:2px;background:#4ade80;transition:width .3s ease}
        nav a:hover::after{width:100%}

        section{padding:100px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #contact{max-width:1200px;margin:0 auto}

        h2{font-size:3.5em;margin-bottom:20px;text-shadow:0 0 30px rgba(0,0,0,.8)}

        #contact p{font-size:1.3em;margin:15px 0}
        #contact a{color:#4ade80;transition:.3s}
        #contact a:hover{opacity:0.8}

        footer{background:#000;text-align:center;padding:25px}

        @media(max-width:768px){
            nav a{font-size:1em;margin:0 10px}
            h2{font-size:2.5em}
            #contact p{font-size:1.1em}
        }
    </style>

    <section id="contact">

        <p>Sähköposti: <a href="mailto:example@email.com">example@email.com</a></p>
        <p>Puhelin: <a href="tel:+358405247918">040 5247918</a></p>
    </section>

    <footer>

    </footer>

    <script>
        // Dynaaminen otsikko – VANHA TOIMIVA VERSIO + PARANNETTU ANIMAATIO
        const titles = ['Ota yhteyttä','Työskennellään yhdessä','Keskustellaan projekteista'];
        let i = 0;
        const titleEl = document.querySelector('#contact h2');

        // Näytetään ensimmäinen heti
        titleEl.textContent = titles[0];
        titleEl.style.opacity = 1;

        setInterval(() => {
            titleEl.style.opacity = 0;
            titleEl.style.transform = 'translateY(20px)';
            setTimeout(() => {
                i = (i + 1) % titles.length;
                titleEl.textContent = titles[i];
                titleEl.style.opacity = 1;
                titleEl.style.transform = 'translateY(0)';
            }, 600);
        }, 3000);
    </script>
